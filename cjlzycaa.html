<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱爱OA审批系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8e53 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ff6b9d;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffe0ec;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.2);
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .kiss-type {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .kiss-type label {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 15px;
            background: #fff5f8;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: normal;
            color: #666;
        }

        .kiss-type label:hover {
            background: #ffe0ec;
        }

        .kiss-type input[type="radio"] {
            display: none;
        }

        .kiss-type input[type="radio"]:checked + span {
            color: #ff6b9d;
            font-weight: bold;
        }

        .kiss-type label:has(input:checked) {
            background: #ffe0ec;
            border: 2px solid #ff6b9d;
            margin: -2px;
        }

        .priority {
            display: flex;
            gap: 10px;
        }

        .priority label {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #fff5f8;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: normal;
            color: #666;
        }

        .priority label:hover {
            background: #ffe0ec;
        }

        .priority input[type="radio"] {
            display: none;
        }

        .priority input[type="radio"]:checked + span {
            color: #ff6b9d;
            font-weight: bold;
        }

        .priority label:has(input:checked) {
            background: #ffe0ec;
            border: 2px solid #ff6b9d;
            margin: -2px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8e53 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 157, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .approval-status {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .approval-status.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }

        .status-icon.pending {
            background: #fff3cd;
        }

        .status-icon.processing {
            background: #d1ecf1;
        }

        .status-icon.done {
            background: #d4edda;
        }

        .approval-result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            animation: bounceIn 0.6s ease;
        }

        .approval-result.approved {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
        }

        .approval-result.rejected {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border: 2px solid #dc3545;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .approval-result .emoji {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .approval-result .message {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .history-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .history-section.show {
            display: block;
        }

        .history-section h3 {
            color: #ff6b9d;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .history-item {
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .history-item .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }

        .history-item .status.approved {
            background: #d4edda;
            color: #155724;
        }

        .history-item .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .history-item .date {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .section-title {
            font-size: 16px;
            color: #ff6b9d;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ffe0ec;
        }

        .required::after {
            content: " *";
            color: #ff4444;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 107, 157, 0.3);
            border-radius: 50%;
            border-top-color: #ff6b9d;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .processing-text {
            display: flex;
            align-items: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>爱爱OA审批系统</h1>
            <div class="subtitle">Love Approval Management System v1.0</div>
        </div>

        <div class="content">
            <div class="section-title">申请表单</div>

            <form id="kissForm">
                <div class="form-group">
                    <label>申请编号</label>
                    <input type="text" id="appId" readonly style="background: #f8f9fa; color: #999;">
                </div>

                <div class="form-group">
                    <label class="required">申请人</label>
                    <input type="text" id="applicant" placeholder="请输入你的昵称" required>
                </div>

                <div class="form-group">
                    <label class="required">爱爱类型</label>
                    <div class="kiss-type">
                        <label>
                            <input type="radio" name="kissType" value="forehead" checked>
                            <span>69式</span>
                        </label>
                        <label>
                            <input type="radio" name="kissType" value="cheek">
                            <span>日常爱爱</span>
                        </label>
                        <label>
                            <input type="radio" name="kissType" value="lip">
                            <span>全套爱爱</span>
                        </label>
                        <label>
                            <input type="radio" name="kissType" value="hug">
                            <span>抱抱+亲亲</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="required">期望时间</label>
                    <input type="datetime-local" id="expectedTime" required>
                </div>

                <div class="form-group">
                    <label class="required">期望地点</label>
                    <select id="location" required>
                        <option value="">请选择地点</option>
                        <option value="客厅">客厅</option>
                        <option value="卧室">卧室</option>
                        <option value="厨房">厨房</option>
                        <option value="阳台">阳台</option>
                        <option value="出门前">出门前</option>
                        <option value="回家后">回家后</option>
                        <option value="其他">其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="required">紧急程度</label>
                    <div class="priority">
                        <label>
                            <input type="radio" name="priority" value="low" checked>
                            <span>一般</span>
                        </label>
                        <label>
                            <input type="radio" name="priority" value="medium">
                            <span>比较急</span>
                        </label>
                        <label>
                            <input type="radio" name="priority" value="high">
                            <span>非常急</span>
                        </label>
                        <label>
                            <input type="radio" name="priority" value="urgent">
                            <span>十万火急</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="required">申请理由</label>
                    <textarea id="reason" placeholder="请真诚地写出你想要爱爱的理由..." required></textarea>
                </div>

                <div class="form-group">
                    <label>附加承诺（可选）</label>
                    <input type="text" id="promise" placeholder="例如：今天洗碗、给老婆按摩30分钟...">
                </div>

                <button type="submit" class="submit-btn">提交审批申请</button>
            </form>

            <div class="approval-status" id="approvalStatus">
                <div class="section-title">审批进度</div>
                <div class="status-item">
                    <div class="status-icon done">📝</div>
                    <div>
                        <div style="font-weight: bold;">申请已提交</div>
                        <div style="font-size: 12px; color: #999;" id="submitTime"></div>
                    </div>
                </div>
                <div class="status-item" id="processingItem">
                    <div class="status-icon processing">⏳</div>
                    <div>
                        <div class="processing-text">
                            <div class="spinner"></div>
                            <span>老婆大人审批中...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="history-section" id="historySection">
                <h3>历史申请记录</h3>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        // 生成申请编号
        function generateAppId() {
            const now = new Date();
            const date = now.toISOString().slice(0, 10).replace(/-/g, '');
            const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            return `KISS-${date}-${random}`;
        }

        // 初始化
        document.getElementById('appId').value = generateAppId();

        // 设置默认时间为1小时后
        const now = new Date();
        now.setHours(now.getHours() + 1);
        const defaultTime = now.toISOString().slice(0, 16);
        document.getElementById('expectedTime').value = defaultTime;

        // 加载历史记录
        let history = JSON.parse(localStorage.getItem('kissHistory') || '[]');
        if (history.length > 0) {
            document.getElementById('historySection').classList.add('show');
            renderHistory();
        }

        // 表单提交
        document.getElementById('kissForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = {
                appId: document.getElementById('appId').value,
                applicant: document.getElementById('applicant').value,
                kissType: document.querySelector('input[name="kissType"]:checked').value,
                expectedTime: document.getElementById('expectedTime').value,
                location: document.getElementById('location').value,
                priority: document.querySelector('input[name="priority"]:checked').value,
                reason: document.getElementById('reason').value,
                promise: document.getElementById('promise').value,
                submitTime: new Date().toLocaleString('zh-CN')
            };

            // 显示审批进度
            const approvalStatus = document.getElementById('approvalStatus');
            approvalStatus.classList.add('show');
            document.getElementById('submitTime').textContent = formData.submitTime;

            // 移除之前的审批结果（如果有）
            const oldResult = approvalStatus.querySelector('.approval-result');
            if (oldResult) oldResult.remove();

            // 重置处理状态
            document.getElementById('processingItem').style.display = 'flex';

            // 模拟审批过程
            setTimeout(() => {
                // 隐藏处理中的动画
                document.getElementById('processingItem').style.display = 'none';

                // 随机审批结果（70%通过率）
                const approved = Math.random() > 0.3;

                const resultDiv = document.createElement('div');
                resultDiv.className = `approval-result ${approved ? 'approved' : 'rejected'}`;

                if (approved) {
                    resultDiv.innerHTML = `
                        <div class="emoji">💕</div>
                        <div class="message">恭喜！申请已通过！</div>
                        <p style="margin-top: 10px; color: #155724;">老婆大人说：看在你这么诚恳的份上，批准了！记得兑现承诺哦~</p>
                    `;
                } else {
                    const rejectReasons = [
                        '老婆大人现在在忙，请稍后再试',
                        '理由不够充分，请补充更多爱的证明',
                        '今日亲亲额度已用完，请明日再申请',
                        '需要先完成家务任务才能申请',
                        '心情不佳，暂不受理',
                        '表现不够好，观察期延长',
                        '你确定今天刷牙了吗？'
                    ];
                    const reason = rejectReasons[Math.floor(Math.random() * rejectReasons.length)];

                    resultDiv.innerHTML = `
                        <div class="emoji">😤</div>
                        <div class="message">申请未通过</div>
                        <p style="margin-top: 10px; color: #721c24;">老婆大人说：${reason}</p>
                    `;
                }

                approvalStatus.appendChild(resultDiv);

                // 保存到历史记录
                formData.status = approved ? 'approved' : 'rejected';
                formData.rejectReason = approved ? '' : reason;
                history.unshift(formData);
                localStorage.setItem('kissHistory', JSON.stringify(history));

                // 更新历史记录显示
                document.getElementById('historySection').classList.add('show');
                renderHistory();

                // 生成新的申请编号
                document.getElementById('appId').value = generateAppId();

            }, 2000);
        });

        // 渲染历史记录
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            const kissTypeMap = {
                'forehead': '69式',
                'cheek': '日常爱爱',
                'lip': '全套爱爱',
                'hug': '抱抱+亲亲'
            };

            const priorityMap = {
                'low': '一般',
                'medium': '比较急',
                'high': '非常急',
                'urgent': '十万火急'
            };

            history.slice(0, 5).forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.appId}</strong> - ${kissTypeMap[item.kissType]}
                        <span class="status ${item.status}">${item.status === 'approved' ? '已通过' : '已拒绝'}</span>
                    </div>
                    <div class="date">${item.submitTime} | ${priorityMap[item.priority]}</div>
                `;
                historyList.appendChild(div);
            });
        }
    </script>
</body>
</html>
