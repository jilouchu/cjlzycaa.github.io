<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱爱OA审批系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8e53 100%);
            color: white;
            padding: 28px 24px;
            text-align: center;
        }
        .header h1 { font-size: 26px; margin-bottom: 6px; }
        .header .subtitle { font-size: 13px; opacity: 0.85; }

        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        .badge-apply { background: rgba(255,255,255,0.25); color: white; }
        .badge-review { background: rgba(255,255,255,0.35); color: white; border: 1px solid rgba(255,255,255,0.5); }

        .content { padding: 24px; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 7px;
            color: #ff6b9d; font-weight: bold; font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px;
            border: 2px solid #ffe0ec; border-radius: 10px;
            font-size: 14px; transition: all 0.3s; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: #ff6b9d;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.2);
        }
        .form-group textarea { height: 90px; resize: vertical; }

        .option-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .option-group label {
            display: flex; align-items: center; gap: 4px;
            padding: 9px 14px; background: #fff5f8;
            border-radius: 10px; cursor: pointer;
            transition: all 0.2s; font-weight: normal; color: #666;
            border: 2px solid transparent; font-size: 14px;
        }
        .option-group label:hover { background: #ffe0ec; }
        .option-group input[type="radio"] { display: none; }
        .option-group label:has(input:checked) {
            background: #ffe0ec; border-color: #ff6b9d; color: #ff6b9d; font-weight: bold;
        }

        .priority label { flex: 1; justify-content: center; text-align: center; }

        .required::after { content: " *"; color: #ff4444; }

        .btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 12px;
            font-size: 17px; font-weight: bold;
            cursor: pointer; transition: all 0.3s;
            margin-top: 6px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }

        .btn-submit {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8e53 100%);
            color: white;
        }
        .btn-submit:hover { box-shadow: 0 10px 20px rgba(255, 107, 157, 0.4); }

        .btn-approve {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }
        .btn-approve:hover { box-shadow: 0 10px 20px rgba(86, 171, 47, 0.4); }

        .btn-reject {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }
        .btn-reject:hover { box-shadow: 0 10px 20px rgba(231, 76, 60, 0.4); }

        .btn-copy {
            background: #fff5f8; color: #ff6b9d;
            border: 2px solid #ff6b9d; margin-top: 12px;
        }
        .btn-copy:hover { background: #ffe0ec; }

        .btn-reset {
            background: transparent; color: #999;
            border: 2px solid #ddd; margin-top: 8px; font-size: 14px;
        }
        .btn-reset:hover { border-color: #999; color: #666; }

        .section-title {
            font-size: 15px; color: #ff6b9d; font-weight: bold;
            margin-bottom: 14px; padding-bottom: 8px;
            border-bottom: 2px solid #ffe0ec;
        }

        /* ===== 详情页 ===== */
        .detail-card {
            background: #fafafa; border-radius: 12px;
            padding: 18px; margin-bottom: 18px;
        }
        .detail-row {
            display: flex; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #999; }
        .detail-value { color: #333; font-weight: 500; text-align: right; max-width: 60%; }

        .detail-reason {
            margin-top: 12px; padding: 14px;
            background: white; border-radius: 10px;
            border-left: 4px solid #ff6b9d;
            font-size: 14px; line-height: 1.6; color: #555;
        }

        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        .btn-group .btn { flex: 1; }

        /* ===== 结果 ===== */
        .result-box {
            text-align: center; padding: 30px 20px;
            border-radius: 14px; margin-top: 20px;
            animation: popIn 0.5s ease;
        }
        .result-box.approved {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            border: 2px solid #28a745;
        }
        .result-box.rejected {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            border: 2px solid #dc3545;
        }
        .result-box .emoji { font-size: 56px; margin-bottom: 10px; }
        .result-box .msg { font-size: 20px; font-weight: bold; }
        .result-box .sub { font-size: 14px; margin-top: 8px; opacity: 0.8; }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ===== 分享区 ===== */
        .share-box {
            margin-top: 20px; padding: 18px;
            background: #f8f9fa; border-radius: 12px;
            display: none;
            animation: fadeInUp 0.4s ease;
        }
        .share-box.show { display: block; }
        .share-box .title { font-size: 15px; font-weight: bold; color: #ff6b9d; margin-bottom: 10px; }
        .share-box .desc { font-size: 13px; color: #888; margin-bottom: 12px; }

        .link-area {
            display: flex; gap: 8px; align-items: stretch;
        }
        .link-area input {
            flex: 1; padding: 10px 12px;
            border: 2px solid #ffe0ec; border-radius: 8px;
            font-size: 13px; background: white; color: #333;
        }
        .link-area input:focus { outline: none; border-color: #ff6b9d; }
        .link-area .copy-btn {
            padding: 10px 18px; background: #ff6b9d; color: white;
            border: none; border-radius: 8px; font-size: 14px;
            font-weight: bold; cursor: pointer; white-space: nowrap;
            transition: all 0.2s;
        }
        .link-area .copy-btn:hover { background: #e55a8a; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #333; color: white;
            padding: 12px 24px; border-radius: 10px;
            font-size: 14px; z-index: 999;
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ===== 历史 ===== */
        .history-section {
            margin-top: 24px; padding: 18px;
            background: #f8f9fa; border-radius: 12px;
            display: none;
        }
        .history-section.show { display: block; }
        .history-item {
            padding: 10px 12px; background: white;
            border-radius: 8px; margin-bottom: 8px; font-size: 13px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .history-item .left { color: #333; }
        .history-item .right { font-size: 12px; color: #999; }
        .status-tag {
            display: inline-block; padding: 2px 8px;
            border-radius: 4px; font-size: 11px; margin-left: 6px;
        }
        .status-tag.approved { background: #d4edda; color: #155724; }
        .status-tag.rejected { background: #f8d7da; color: #721c24; }
        .status-tag.pending { background: #fff3cd; color: #856404; }

        /* ===== 已审批列表 ===== */
        .reviewed-section { margin-top: 24px; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ========== 申请人模式 ========== -->
<div class="container" id="applyPage" style="display:none;">
    <div class="header">
        <h1>爱爱OA审批系统</h1>
        <div class="subtitle">Love Approval Management System</div>
        <div class="badge badge-apply">申请人模式</div>
    </div>
    <div class="content">
        <div class="section-title">填写申请</div>
        <form id="kissForm">
            <div class="form-group">
                <label>申请编号</label>
                <input type="text" id="appId" readonly style="background:#f8f9fa;color:#999;">
            </div>
            <div class="form-group">
                <label class="required">你的昵称</label>
                <input type="text" id="applicant" placeholder="请输入你的昵称" required>
            </div>
            <div class="form-group">
                <label class="required">爱爱类型</label>
                <div class="option-group">
                    <label><input type="radio" name="kissType" value="forehead" checked><span>69式</span></label>
                    <label><input type="radio" name="kissType" value="cheek"><span>普通套餐</span></label>
                    <label><input type="radio" name="kissType" value="lip"><span>全套鲸喷套餐</span></label>
                    <label><input type="radio" name="kissType" value="hug"><span>抱抱+亲亲</span></label>
                </div>
            </div>
            <div class="form-group">
                <label class="required">期望地点</label>
                <select id="location" required>
                    <option value="">请选择</option>
                    <option value="客厅">客厅</option>
                    <option value="卧室">卧室</option>
                    <option value="厨房">厨房</option>
                    <option value="阳台">阳台</option>
                    <option value="出门前">出门前</option>
                    <option value="回家后">回家后</option>
                    <option value="约会时">约会时</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label class="required">紧急程度</label>
                <div class="option-group priority">
                    <label><input type="radio" name="priority" value="normal" checked><span>一般</span></label>
                    <label><input type="radio" name="priority" value="medium"><span>比较急</span></label>
                    <label><input type="radio" name="priority" value="high"><span>非常急</span></label>
                    <label><input type="radio" name="priority" value="urgent"><span>十万火急</span></label>
                </div>
            </div>
            <div class="form-group">
                <label class="required">申请理由</label>
                <textarea id="reason" placeholder="请真诚地写出你想要爱爱的理由..." required></textarea>
            </div>
            <div class="form-group">
                <label>附加承诺（可选）</label>
                <input type="text" id="promise" placeholder="例如：今天洗碗、给老婆按摩30分钟...">
            </div>
            <button type="submit" class="btn btn-submit">提交申请</button>
        </form>

        <!-- 分享链接区 -->
        <div class="share-box" id="shareBox">
            <div class="title">申请已生成！</div>
            <div class="desc">复制下面的链接发给老婆，她打开就能审批啦~</div>
            <div class="link-area">
                <input type="text" id="shareLink" readonly>
                <button class="copy-btn" onclick="copyLink()">复制链接</button>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="history-section" id="historySection">
            <div class="section-title">我的申请记录</div>
            <div id="historyList"></div>
        </div>
    </div>
</div>

<!-- ========== 审批人模式 ========== -->
<div class="container" id="reviewPage" style="display:none;">
    <div class="header">
        <h1>爱爱OA审批系统</h1>
        <div class="subtitle">Love Approval Management System</div>
        <div class="badge badge-review">审批人模式</div>
    </div>
    <div class="content">
        <div id="pendingReview">
            <div class="section-title">收到一份爱爱申请</div>
            <div class="detail-card">
                <div class="detail-row">
                    <span class="detail-label">申请编号</span>
                    <span class="detail-value" id="rAppId"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">申请人</span>
                    <span class="detail-value" id="rApplicant"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">爱爱类型</span>
                    <span class="detail-value" id="rKissType"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">期望地点</span>
                    <span class="detail-value" id="rLocation"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">紧急程度</span>
                    <span class="detail-value" id="rPriority"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">附加承诺</span>
                    <span class="detail-value" id="rPromise"></span>
                </div>
                <div class="detail-reason" id="rReason"></div>
            </div>

            <div class="form-group">
                <label>审批意见（可选）</label>
                <textarea id="reviewComment" placeholder="写点什么给申请人吧~"></textarea>
            </div>

            <div class="btn-group">
                <button class="btn btn-approve" onclick="handleReview('approved')">批准亲亲</button>
                <button class="btn btn-reject" onclick="handleReview('rejected')">驳回申请</button>
            </div>
        </div>

        <!-- 审批结果（审批人看到的） -->
        <div id="reviewResult" style="display:none;"></div>

        <!-- 已审批的列表 -->
        <div class="reviewed-section" id="reviewedSection" style="display:none;">
            <div class="section-title" style="margin-top:20px;">已审批记录</div>
            <div id="reviewedList"></div>
        </div>
    </div>
</div>

<!-- ========== 已处理过（再次打开链接） ========== -->
<div class="container" id="donePage" style="display:none;">
    <div class="header">
        <h1>亲亲OA审批系统</h1>
        <div class="subtitle">Love Approval Management System</div>
    </div>
    <div class="content">
        <div id="doneResult"></div>
    </div>
</div>

<script>
    // ===== 常量 =====
    const KISS_MAP = { forehead: '69式', cheek: '普通套餐', lip: '全套鲸喷套餐', hug: '抱抱+亲亲' };
    const PRIORITY_MAP = { normal: '一般', medium: '比较急', high: '非常急', urgent: '十万火急' };

    // ===== 工具 =====
    function showToast(msg, duration = 2000) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    function genAppId() {
        const d = new Date().toISOString().slice(0,10).replace(/-/g,'');
        const r = Math.floor(Math.random()*1000).toString().padStart(3,'0');
        return 'KISS-' + d + '-' + r;
    }

    function encodeData(obj) {
        return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    }

    function decodeData(str) {
        try {
            return JSON.parse(decodeURIComponent(escape(atob(str))));
        } catch(e) { return null; }
    }

    // ===== 获取审批记录（本地存储，审批人端） =====
    function getReviews() {
        return JSON.parse(localStorage.getItem('kissReviews') || '[]');
    }
    function saveReview(record) {
        const list = getReviews();
        list.unshift(record);
        localStorage.setItem('kissReviews', JSON.stringify(list));
    }

    // ===== 获取申请记录（本地存储，申请人端） =====
    function getHistory() {
        return JSON.parse(localStorage.getItem('kissHistory') || '[]');
    }
    function saveHistory(record) {
        const list = getHistory();
        list.unshift(record);
        localStorage.setItem('kissHistory', JSON.stringify(list));
    }

    // ===== 路由：判断当前是申请人模式还是审批人模式 =====
    function route() {
        const hash = window.location.hash.slice(1);
        if (hash && hash.startsWith('review=')) {
            const data = decodeData(hash.replace('review=', ''));
            if (data) {
                showReviewPage(data);
            } else {
                showToast('链接无效或已过期');
                showApplyPage();
            }
        } else {
            showApplyPage();
        }
    }

    // ===== 显示申请人页面 =====
    function showApplyPage() {
        document.getElementById('applyPage').style.display = '';
        document.getElementById('reviewPage').style.display = 'none';
        document.getElementById('donePage').style.display = 'none';

        document.getElementById('appId').value = genAppId();
        renderHistory();
    }

    // ===== 显示审批人页面 =====
    function showReviewPage(data) {
        // 检查是否已经审批过（通过 localStorage）
        const reviews = getReviews();
        const already = reviews.find(r => r.appId === data.appId);

        if (already) {
            // 已审批过，直接显示结果
            document.getElementById('applyPage').style.display = 'none';
            document.getElementById('reviewPage').style.display = 'none';
            document.getElementById('donePage').style.display = '';

            const status = already.status;
            const div = document.getElementById('doneResult');
            div.innerHTML = buildResultHTML(status, already.comment || '', data.applicant);
            return;
        }

        document.getElementById('applyPage').style.display = 'none';
        document.getElementById('reviewPage').style.display = '';
        document.getElementById('donePage').style.display = 'none';

        // 填充数据
        document.getElementById('rAppId').textContent = data.appId;
        document.getElementById('rApplicant').textContent = data.applicant;
        document.getElementById('rKissType').textContent = KISS_MAP[data.kissType] || data.kissType;
        document.getElementById('rLocation').textContent = data.location;
        document.getElementById('rPriority').textContent = PRIORITY_MAP[data.priority] || data.priority;
        document.getElementById('rPromise').textContent = data.promise || '无';
        document.getElementById('rReason').textContent = data.reason;

        // 存储当前待审批的数据
        window._currentReview = data;

        // 渲染已审批列表
        renderReviewed();
    }

    // ===== 审批操作 =====
    function handleReview(status) {
        const data = window._currentReview;
        if (!data) return;

        const comment = document.getElementById('reviewComment').value.trim();

        const record = {
            appId: data.appId,
            applicant: data.applicant,
            kissType: data.kissType,
            location: data.location,
            priority: data.priority,
            reason: data.reason,
            promise: data.promise,
            status: status,
            comment: comment,
            reviewTime: new Date().toLocaleString('zh-CN')
        };

        saveReview(record);

        // 隐藏审批表单，显示结果
        document.getElementById('pendingReview').style.display = 'none';
        const resultDiv = document.getElementById('reviewResult');
        resultDiv.style.display = '';
        resultDiv.innerHTML = buildResultHTML(status, comment, data.applicant);

        renderReviewed();
    }

    // ===== 构建结果 HTML =====
    function buildResultHTML(status, comment, applicant) {
        if (status === 'approved') {
            return `
                <div class="result-box approved">
                    <div class="emoji">💕</div>
                    <div class="msg">审批通过！</div>
                    <div class="sub">已批准给「${applicant || '申请人'}」一个亲亲</div>
                    ${comment ? '<div style="margin-top:12px;font-size:14px;color:#155724;">审批意见：' + comment + '</div>' : ''}
                </div>`;
        } else {
            const reasons = [
                '理由不够充分，请补充更多爱的证明',
                '今日爱爱额度已用完，请明日再申请',
                '需要先完成家务任务才能申请',
                '心情不佳，暂不受理',
                '表现不够好，观察期延长',
                '你确定今天刷牙了吗？'
            ];
            const defaultReason = reasons[Math.floor(Math.random() * reasons.length)];
            return `
                <div class="result-box rejected">
                    <div class="emoji">😤</div>
                    <div class="msg">申请被驳回</div>
                    <div class="sub">${comment ? '审批意见：' + comment : defaultReason}</div>
                </div>`;
        }
    }

    // ===== 渲染已审批列表 =====
    function renderReviewed() {
        const list = getReviews();
        if (list.length === 0) return;

        document.getElementById('reviewedSection').style.display = '';
        const container = document.getElementById('reviewedList');
        container.innerHTML = '';

        list.slice(0, 10).forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="left">
                    <strong>${item.applicant}</strong> - ${KISS_MAP[item.kissType] || item.kissType}
                    <span class="status-tag ${item.status}">${item.status === 'approved' ? '已批准' : '已驳回'}</span>
                </div>
                <div class="right">${item.reviewTime}</div>
            `;
            container.appendChild(div);
        });
    }

    // ===== 提交申请（申请人端） =====
    document.getElementById('kissForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = {
            appId: document.getElementById('appId').value,
            applicant: document.getElementById('applicant').value.trim(),
            kissType: document.querySelector('input[name="kissType"]:checked').value,
            location: document.getElementById('location').value,
            priority: document.querySelector('input[name="priority"]:checked').value,
            reason: document.getElementById('reason').value.trim(),
            promise: document.getElementById('promise').value.trim(),
            submitTime: new Date().toLocaleString('zh-CN')
        };

        // 生成分享链接
        const encoded = encodeData(formData);
        const shareUrl = window.location.origin + window.location.pathname + '#review=' + encoded;

        document.getElementById('shareLink').value = shareUrl;
        document.getElementById('shareBox').classList.add('show');

        // 保存到本地历史
        saveHistory({ ...formData, status: 'pending' });
        renderHistory();

        // 重置表单
        document.getElementById('kissForm').reset();
        document.getElementById('appId').value = genAppId();
        document.querySelector('input[name="kissType"][value="forehead"]').checked = true;
        document.querySelector('input[name="priority"][value="normal"]').checked = true;

        // 滚动到分享区
        document.getElementById('shareBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // ===== 复制链接 =====
    function copyLink() {
        const input = document.getElementById('shareLink');
        input.select();
        input.setSelectionRange(0, 99999);

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(input.value).then(() => {
                showToast('链接已复制，快去发给老婆吧！');
            }).catch(() => {
                document.execCommand('copy');
                showToast('链接已复制，快去发给老婆吧！');
            });
        } else {
            document.execCommand('copy');
            showToast('链接已复制，快去发给老婆吧！');
        }
    }

    // ===== 渲染申请历史 =====
    function renderHistory() {
        const list = getHistory();
        if (list.length === 0) return;

        document.getElementById('historySection').classList.add('show');
        const container = document.getElementById('historyList');
        container.innerHTML = '';

        list.slice(0, 8).forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="left">
                    ${KISS_MAP[item.kissType] || item.kissType}
                    <span class="status-tag ${item.status || 'pending'}">
                        ${item.status === 'approved' ? '已批准' : item.status === 'rejected' ? '已驳回' : '待审批'}
                    </span>
                </div>
                <div class="right">${item.submitTime}</div>
            `;
            container.appendChild(div);
        });
    }

    // ===== 启动 =====
    route();
</script>
</body>
</html>
